# Use this when the VPS already runs nginx (or another proxy) on ports 80/443:
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d --build
# Caddy is switched off and the app listens on 127.0.0.1:3000 only,
# so nginx (deploy/nginx-clarifyme.conf) can proxy to it.
services:
  caddy:
    profiles: ["caddy"]
  app:
    ports:
      - "127.0.0.1:3000:3000"
