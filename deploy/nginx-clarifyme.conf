# nginx site for ClarifyMe, used with docker-compose.nginx.yml.
#   sudo cp deploy/nginx-clarifyme.conf /etc/nginx/sites-available/clarifyme
#   sudo ln -s ../sites-available/clarifyme /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d clarifyme.maidocs.in     # adds HTTPS + redirect
server {
    listen 80;
    listen [::]:80;
    server_name clarifyme.maidocs.in;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:3417;   # must match APP_PORT in .env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so visitors cannot spoof their IP for the rate limiter.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
    }
}
